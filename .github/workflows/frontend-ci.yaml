name: Frontend Continuous Integration

# ──────────────────────────────────────────────────────────────
# Triggers
# ──────────────────────────────────────────────────────────────
on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/frontend/**'   # Only run when frontend code changes
  workflow_dispatch:            # Allow manual execution from the Actions tab

# ──────────────────────────────────────────────────────────────
# Shared defaults – every job runs commands inside the
# starter/frontend directory so we don't repeat it per-step.
# ──────────────────────────────────────────────────────────────
defaults:
  run:
    working-directory: starter/frontend

jobs:

  # ────────────────────────────────────────────────────────────
  # Job 1: lint
  # Runs ESLint to enforce code-quality rules.
  # Executes in PARALLEL with the test job.
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc   # Pins to 18.14 as declared in .nvmrc

      - name: Restore cached npm dependencies
        uses: actions/cache@v4
        with:
          path: starter/frontend/node_modules
          key: ${{ runner.os }}-frontend-node-modules-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ────────────────────────────────────────────────────────────
  # Job 2: test
  # Runs the React test suite in non-interactive CI mode.
  # Executes in PARALLEL with the lint job.
  # ────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc

      - name: Restore cached npm dependencies
        uses: actions/cache@v4
        with:
          path: starter/frontend/node_modules
          key: ${{ runner.os }}-frontend-node-modules-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test   # CI=true prevents the watcher from hanging and treats warnings as errors

  # ────────────────────────────────────────────────────────────
  # Job 3: build
  # Builds the Docker image ONLY after lint AND test succeed.
  # The image is NOT pushed anywhere (no registry, no AWS, no CD).
  # ────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc

      - name: Restore cached npm dependencies
        uses: actions/cache@v4
        with:
          path: starter/frontend/node_modules
          key: ${{ runner.os }}-frontend-node-modules-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        env:
          REACT_APP_MOVIE_API_URL: http://localhost:5000
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=$REACT_APP_MOVIE_API_URL \
            -t frontend:test \
            .
        # The Dockerfile already declares:
        #   ARG REACT_APP_MOVIE_API_URL
        #   ENV REACT_APP_MOVIE_API_URL=${REACT_APP_MOVIE_API_URL}
        # so the build-arg is correctly injected and baked in.
        # The image is only built locally on the runner – it is NOT pushed.
